[project]
name = "agent46"
version = "0.1.0"
description = "Insurance agent starter template for Agent Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "agent-engine-runner-shared[mongodb,tracing]>=0.11.3,<1",
    "agent-engine-sdk-langgraph>=0.11.3,<1",
    "python-dotenv>=1.0.0",
    "langchain-google-genai>=2.1.0",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.1.12",
    "langchain-xai>=1.3.0",
    "langchain-anthropic>=1.4.0",
    "raindrop-ai>=0.0.1",
    # Cooldown (uv.toml) can hold opentelemetry-instrumentation back while -logging floats ahead;
    # a mismatch makes `import raindrop.analytics` fail. Keep these two on the same version.
    "opentelemetry-instrumentation-logging==0.63b1",
]

[project.scripts]
agent46 = "agent_agent46.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_agent46"]

[dependency-groups]
evolve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",  # fastapi TestClient
]
dev = [
    "pyright>=1.1.390",
    "pytest>=9.1.1",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
